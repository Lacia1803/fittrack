<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FitTrack — Workout Log</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: rgba(255, 255, 255, 0.04);
      --surface-strong: rgba(255, 255, 255, 0.08);
      --fg: #f3f6ff;
      --muted: #9aa3b2;
      --border: rgba(255, 255, 255, 0.12);
      --accent: #f97316;
      --accent-soft: rgba(249, 115, 22, 0.18);
      --radius: 20px;
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.45);
      --font-display: "Space Grotesk", "Sora", "SF Pro Display", "Segoe UI", system-ui, sans-serif;
      --font-body: "SF Pro Text", "Segoe UI", system-ui, sans-serif;
      --font-mono: "JetBrains Mono", "Cascadia Mono", ui-monospace, Menlo, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      text-wrap: pretty;
    }
    .layout {
      min-height: 100vh;
      padding: 24px;
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 20px;
    }
    .glass {
      background: linear-gradient(180deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 16px;
    }
    .header h1 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 28px;
    }
    .muted { color: var(--muted); }
    .log-card, .side-card {
      padding: 20px;
      display: grid;
      gap: 16px;
    }
    .set-row {
      display: grid;
      grid-template-columns: 40px 1fr 1fr 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 8px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
    }
    .set-row input {
      width: 100%;
      background: transparent;
      border: 0;
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 14px;
      outline: none;
    }
    .set-row .set-num {
      font-family: var(--font-mono);
      color: var(--muted);
      text-align: center;
    }
    .toggle {
      border: 1px solid rgba(255,255,255,0.12);
      background: transparent;
      color: var(--muted);
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
      font-size: 12px;
    }
    .toggle.active {
      color: #120a03;
      background: var(--accent);
      border-color: transparent;
    }
    .btn {
      border: 0;
      border-radius: 999px;
      padding: 10px 16px;
      background: var(--accent);
      color: #120a03;
      font-weight: 600;
      cursor: pointer;
      justify-self: start;
    }
    .timer {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-mono);
      font-size: 28px;
      letter-spacing: 0.08em;
    }
    .timer button {
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      background: rgba(249, 115, 22, 0.18);
      color: var(--accent);
      cursor: pointer;
      font-weight: 600;
    }
    .summary {
      display: grid;
      gap: 10px;
      font-family: var(--font-mono);
    }
    .summary span { color: var(--muted); }
    @media (max-width: 960px) {
      .layout { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      .set-row { grid-template-columns: 34px 1fr 1fr 1fr; }
      .set-row .toggle { grid-column: 1 / -1; justify-self: start; }
    }
  </style>
</head>
<body>
  <div class="layout">
    <section>
      <div class="header">
        <div>
          <h1>Workout Log · Pull Day</h1>
          <div class="muted">Lat Pulldown · 5 set · Rest 90s</div>
        </div>
        <a href="dashboard.html" class="muted" style="text-decoration:none;">Quay lại dashboard</a>
      </div>

      <div class="log-card glass" id="log-card">
        <strong>Ghi từng set</strong>
        <div class="set-row">
          <div class="set-num">1</div>
          <input type="number" class="weight" value="60" /> 
          <input type="number" class="reps" value="12" />
          <input type="number" class="rpe" value="8" />
          <button class="toggle">Hoàn thành</button>
        </div>
        <div class="set-row">
          <div class="set-num">2</div>
          <input type="number" class="weight" value="65" />
          <input type="number" class="reps" value="10" />
          <input type="number" class="rpe" value="8" />
          <button class="toggle">Hoàn thành</button>
        </div>
        <div class="set-row">
          <div class="set-num">3</div>
          <input type="number" class="weight" value="70" />
          <input type="number" class="reps" value="8" />
          <input type="number" class="rpe" value="9" />
          <button class="toggle">Hoàn thành</button>
        </div>
        <button class="btn" id="add-set">+ Thêm set</button>
      </div>
    </section>

    <aside class="side-card glass">
      <div>
        <strong>Rest timer</strong>
        <div class="timer">
          <span id="rest-timer">01:30</span>
          <button id="rest-toggle">Bắt đầu</button>
        </div>
      </div>

      <div class="summary">
        <strong>Tổng khối lượng</strong>
        <div><span>Volume:</span> <strong id="volume-total">1,880 kg</strong></div>
        <div><span>Set hoàn thành:</span> <strong id="set-count">0/3</strong></div>
        <div><span>AI Coach:</span> <strong>Giữ form, tăng tải +2.5kg tuần tới</strong></div>
      </div>
    </aside>
  </div>

  <script>
    const logCard = document.getElementById('log-card');
    const addSetBtn = document.getElementById('add-set');
    const volumeEl = document.getElementById('volume-total');
    const setCountEl = document.getElementById('set-count');

    function updateTotals() {
      const rows = document.querySelectorAll('.set-row');
      let volume = 0;
      let done = 0;
      rows.forEach(row => {
        const weight = parseFloat(row.querySelector('.weight')?.value || 0);
        const reps = parseFloat(row.querySelector('.reps')?.value || 0);
        volume += weight * reps;
        if (row.querySelector('.toggle')?.classList.contains('active')) done += 1;
      });
      volumeEl.textContent = `${Math.round(volume).toLocaleString('vi-VN')} kg`;
      setCountEl.textContent = `${done}/${rows.length}`;
    }

    function wireRow(row) {
      row.querySelectorAll('input').forEach(input => {
        input.addEventListener('input', updateTotals);
      });
      const toggle = row.querySelector('.toggle');
      toggle.addEventListener('click', () => {
        toggle.classList.toggle('active');
        toggle.textContent = toggle.classList.contains('active') ? 'Đã xong' : 'Hoàn thành';
        updateTotals();
      });
    }

    document.querySelectorAll('.set-row').forEach(wireRow);

    addSetBtn.addEventListener('click', () => {
      const rows = document.querySelectorAll('.set-row');
      const next = rows.length + 1;
      const row = document.createElement('div');
      row.className = 'set-row';
      row.innerHTML = `
        <div class="set-num">${next}</div>
        <input type="number" class="weight" value="60" />
        <input type="number" class="reps" value="10" />
        <input type="number" class="rpe" value="8" />
        <button class="toggle">Hoàn thành</button>
      `;
      logCard.insertBefore(row, addSetBtn);
      wireRow(row);
      updateTotals();
    });

    let remaining = 90;
    let running = false;
    let timerId = null;
    const timerEl = document.getElementById('rest-timer');
    const toggleBtn = document.getElementById('rest-toggle');

    function renderTimer() {
      const min = String(Math.floor(remaining / 60)).padStart(2, '0');
      const sec = String(remaining % 60).padStart(2, '0');
      timerEl.textContent = `${min}:${sec}`;
    }

    toggleBtn.addEventListener('click', () => {
      running = !running;
      toggleBtn.textContent = running ? 'Tạm dừng' : 'Bắt đầu';
      if (running) {
        timerId = setInterval(() => {
          if (remaining > 0) {
            remaining -= 1;
            renderTimer();
          } else {
            clearInterval(timerId);
            running = false;
            toggleBtn.textContent = 'Làm lại';
          }
        }, 1000);
      } else {
        clearInterval(timerId);
      }
      if (!running && remaining === 0) {
        remaining = 90;
        renderTimer();
      }
    });

    renderTimer();
    updateTotals();
  </script>
</body>
</html>
